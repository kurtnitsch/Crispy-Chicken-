[package]
name = "ccos-canister"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ic-cdk = "0.18"
ic-cdk-macros = "0.18"
ic-stable-structures = "0.7"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
candid = "0.10"
thiserror = "1"
base64 = "0.22"

[profile.release]
lto = true
opt-level = "z"
