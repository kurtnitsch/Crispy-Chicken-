name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup DFX (Internet Computer SDK)
        run: |
          curl -fsSL https://internetcomputer.org/install.sh | sh
          source "$HOME/.cache/dfx/dfx-env.sh" || true
      - name: Start local dfx replica
        run: |
          dfx start --background --clean
          sleep 5
      - name: Build wasm artifacts
        run: |
          # adapt to repo language: Rust/AssemblyScript/TypeScript/etc
          # Rust example:
          cd Ccos || true
          cargo build --release --target wasm32-unknown-unknown || true
      - name: wasm-opt (size/perf)
        run: |
          for f in target/wasm32-unknown-unknown/release/*.wasm; do
            if [ -f "$f" ]; then
              wasm-opt -Oz -o ${f%.wasm}.opt.wasm "$f" || true
            fi
          done
      - name: Run unit + integration tests
        run: |
          # Run language-specific tests
          # Rust:
          cd Ccos || true
          cargo test --all || true
      - name: Run benchmarks (local)
        run: |
          python3 ./benchmarks/run_bench.py --out=bench_results.json || true
      - name: Upload benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench_results.json
      - name: Stop local dfx
        run: |
          dfx stop || true
